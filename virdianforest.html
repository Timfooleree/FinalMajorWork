<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field Survey - Viridian Forest</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        /* --- VIRIDIAN FOREST SURVEY STYLES --- */
        .top-nav-bar {
            justify-content: center !important;
            padding: 25px 0 10px 0;
            width: 100%;
        }

        .pokedex-main-title-xl {
            text-align: center;
            letter-spacing: 2px;
            font-size: 1.8rem;
        }

        .dex-main-content {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: auto;
            flex-grow: 1;
        }

        .survey-stage-container {
            width: 92%;
            max-width: 1350px;
            height: 72vh;
            margin: 0 auto;
            border: 2px solid rgba(0, 240, 255, 0.4);
            border-radius: 16px;
            background: rgba(2, 18, 12, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.95);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
        }

        /* Filtered Forest Canopy Light Beams / Spores Overlay */
        .forest-canopy-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background:
                    radial-gradient(circle, rgba(100,255,150,0.15) 1.5px, transparent 1.5px),
                    linear-gradient(135deg, rgba(50,200,100,0.08) 0%, rgba(10,50,30,0.25) 50%, rgba(50,220,120,0.08) 100%);
            background-size: 90px 90px, 200% 200%;
            animation: canopySway 16s ease infinite;
            z-index: 5;
            opacity: 0.65;
        }

        @keyframes canopySway {
            0% { background-position: 0 0, 0% 50%; }
            50% { background-position: 50px 50px, 100% 50%; }
            100% { background-position: 0 0, 0% 50%; }
        }

        .survey-back-btn {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2) 0%, rgba(0, 100, 150, 0.4) 100%);
            border: 1.5px solid #00f0ff;
            color: #00f0ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .survey-back-btn:hover {
            background: #00f0ff;
            color: #020c1c;
            box-shadow: 0 0 15px #00f0ff;
        }

        /* Audio Toggle Button Styling */
        .audio-toggle-btn {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.15) 0%, rgba(0, 100, 150, 0.3) 100%);
            border: 1.5px solid #00f0ff;
            color: #00f0ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .audio-toggle-btn:hover {
            background: #00f0ff;
            color: #020c1c;
            box-shadow: 0 0 15px #00f0ff;
        }

        .audio-icon {
            height: 18px;
            width: 18px;
            object-fit: contain;
        }
    </style>
</head>
<body class="pokedex-page" style="opacity: 0; transition: opacity 0.3s ease;">

<div class="hologram-bg-exact">
    <div class="digital-grid"></div>
    <div class="scanlines-filter"></div>

    <div class="moving-lines">
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
    </div>
</div>

<div class="fullscreen-dex-layout" style="display: flex; flex-direction: column; height: 100vh; overflow: hidden;">

    <header class="top-nav-bar">
        <div class="nav-left" style="justify-content: center; width: 100%;">
            <h1 class="pokedex-main-title-xl">FIELD SURVEY: VIRIDIAN FOREST</h1>
        </div>
    </header>

    <main class="dex-main-content">
        <div class="survey-stage-container">
            <div class="forest-canopy-overlay"></div>

            <model-viewer
                    id="viridian-model"
                    src="Web Assets/forestking.glb"
                    alt="Viridian Forest Environment"
                    camera-controls
                    touch-action="pan-y"
                    disable-pan
                    disable-zoom
                    interaction-prompt="none"
                    shadow-intensity="1.5"
                    exposure="0.9"
                    skybox-color="#142618"
                    environment-image="neutral"
                    tone-mapping="commerce"
                    camera-target="auto auto auto"
                    camera-orbit="0deg 85deg 8m"
                    min-camera-orbit="auto auto 4m"
                    max-camera-orbit="auto auto 12m"
                    field-of-view="60deg">
            </model-viewer>

            <audio id="forest-audio" src="Web%20Assets/forestsounds.mp3" loop preload="auto"></audio>
        </div>
    </main>

    <footer class="dex-bottom-hud" style="width: 100%; padding: 15px 0;">
        <div class="bottom-right-controls" style="width: 92%; max-width: 1350px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; gap: 15px; align-items: center;">
                <a href="fieldsurvey_hub.html" class="survey-back-btn">← BACK TO HUB</a>
                <button id="sound-toggle-btn" class="audio-toggle-btn" onclick="toggleAudio()">
                    <img src="Web%20Assets/audio.png" alt="Audio Icon" class="audio-icon">
                    <span id="sound-text">SOUND: OFF</span>
                </button>
            </div>
            <div class="controls-hint" style="display: flex; align-items: center; gap: 10px;">
                <img src="Web%20Assets/arrows.png" alt="Arrow Keys" class="arrows-img" style="height: 24px;">
                <span>USE MOUSE OR ARROW KEYS TO INSPECT FOREST</span>
            </div>
        </div>
    </footer>

</div>

<script>
    // Fix browser back-button cache blank screen issue
    window.addEventListener("pageshow", (event) => {
        if (event.persisted) {
            window.location.reload();
        }
    });

    // Fade page in on load
    window.addEventListener("DOMContentLoaded", () => {
        document.body.style.opacity = "1";
    });

    // Smooth fade transition when clicking internal links
    document.addEventListener("click", function(e) {
        const target = e.target.closest("a");
        if (target && target.href && target.hostname === window.location.hostname && target.getAttribute("target") !== "_blank") {
            e.preventDefault();
            const destination = target.href;
            document.body.style.transition = "opacity 0.3s ease";
            document.body.style.opacity = "0";
            setTimeout(() => {
                window.location.href = destination;
            }, 300);
        }
    });

    document.addEventListener("DOMContentLoaded", () => {
        const model = document.getElementById("viridian-model");

        /* AUTO-CENTER & ZOOM ON LOAD */
        model.addEventListener("load", () => {
            model.cameraTarget = "auto auto auto";
            model.cameraOrbit = "0deg 85deg 8m";
        });

        /* ARROW KEY ROTATION SUPPORT (UP/DOWN INVERTED FIXED) */
        window.addEventListener("keydown", (e) => {
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
                e.preventDefault();
                const orbit = model.getCameraOrbit();
                let theta = orbit.theta * (180 / Math.PI);
                let phi = orbit.phi * (180 / Math.PI);

                switch(e.code) {
                    case "ArrowLeft":
                        theta += 5;
                        break;
                    case "ArrowRight":
                        theta -= 5;
                        break;
                    case "ArrowUp":
                        phi = Math.min(130, phi + 4);
                        break;
                    case "ArrowDown":
                        phi = Math.max(20, phi - 4);
                        break;
                }

                model.cameraOrbit = `${theta}deg ${phi}deg 8m`;
            }
        });
    });

    /* AUDIO TOGGLE FUNCTION */
    function toggleAudio() {
        const audio = document.getElementById("forest-audio");
        const soundText = document.getElementById("sound-text");

        if (audio.paused) {
            audio.play().then(() => {
                soundText.textContent = "SOUND: ON";
            }).catch(error => {
                console.log("Audio playback blocked or failed:", error);
            });
        } else {
            audio.pause();
            soundText.textContent = "SOUND: OFF";
        }
    }
</script>
</body>
</html>
